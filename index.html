<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PULI LIFE</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PULI LIFE">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo">PULI <span>LIFE</span></div>
    <p class="auth-sub">Tvoj osobný dashboard — financie, pravidlá, ciele.</p>
    <form id="auth-form">
      <label>E-mail
        <input type="email" id="auth-email" autocomplete="email" required placeholder="tvoj@email.com">
      </label>
      <label>Heslo
        <input type="password" id="auth-pass" autocomplete="current-password" required minlength="6" placeholder="••••••••">
      </label>
      <button type="submit" class="btn btn-primary" id="auth-submit">Prihlásiť sa</button>
      <button type="button" class="btn btn-ghost" id="auth-toggle">Nemám účet — registrovať</button>
      <p id="auth-msg" class="auth-msg"></p>
    </form>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="logo">PULI <span>LIFE</span></div>
    <div class="topbar-right">
      <span id="today-label" class="today-label"></span>
      <button class="icon-btn" id="logout-btn" title="Odhlásiť">⎋</button>
    </div>
  </header>

  <main>
    <section class="section active" id="view-overview"></section>
    <section class="section" id="view-finance"></section>
    <section class="section" id="view-life"></section>
    <section class="section" id="view-journal"></section>
    <section class="section" id="view-fitness"></section>
  </main>

  <nav class="bottomnav">
    <button class="nav-btn active" data-view="overview"><span class="nav-ico">◉</span>Prehľad</button>
    <button class="nav-btn" data-view="finance"><span class="nav-ico">€</span>Financie</button>
    <button class="nav-btn" data-view="life"><span class="nav-ico">✓</span>Život</button>
    <button class="nav-btn" data-view="journal"><span class="nav-ico">✎</span>Žurnál</button>
    <button class="nav-btn" data-view="fitness"><span class="nav-ico">▲</span>Fitness</button>
  </nav>
</div>

<!-- ══ MODAL ══ -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" id="modal"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="./vendor/supabase.min.js"></script>
<script src="./config.js?v=2"></script>
<script src="./app.js?v=2"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
